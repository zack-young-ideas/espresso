{% extends 'base.html' %}

{% block stylesheets %}
  <link href="/static/adminLogin.css" rel="stylesheet" />
{% endblock %}

{% block title %}Admin Login{% endblock %}

{% block content %}

  <div class="login-background">
    <div class="container-fluid">
      <fieldset class="border rounded login-form">
        <p align="center">
          <img src="/static/images/espresso.svg" />
        </p>

        <h1>Admin Login</h1>

        <form method="post" action="/admin/login">
          <div class="mb-3">
            <input class="form-control"
                   type="text"
                   name="username"
                   placeholder="Username" />
          </div>
          <div class="mb-3">
            <input class="form-control"
                   type="password"
                   name="password"
                   placeholder="Password" />
          </div>
          {% if errMessage %}
            <p class="text-danger">{{ errMessage }}</p>
          {% endif %}
          <div class="mb-3">
            <input class="btn btn-primary"
                   type="submit"
                   name="submit"
                   value="Log In" />
          </div>
        </form>
      </fieldset>
    </div>
  </div>

{% endblock %}
